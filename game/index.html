<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Palm Cove: Sunset Heist - a top-down open-world crime game. Work off a debt, run side jobs (taxi, races, vigilante, courier, repo), make story choices and reach one of six endings.">
<title>Palm Cove: Sunset Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1426; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palm Cove Sunset Heist: top-down open-world crime game with side jobs, story choices and six endings"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Palm Cove: Sunset Heist needs JavaScript - the whole game is plain ES modules under src/.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
